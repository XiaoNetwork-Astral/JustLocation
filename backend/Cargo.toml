[package]
name = "justlocation-backend"
version = "0.1.0-alpha.1+locenv.3"
edition = "2024"
rust-version = "1.89"
publish = false

[[bin]]
name = "justlocationd"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = "debuginfo"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
# Use the Rust decompressor to avoid a C dependency in Android cross-builds.
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
